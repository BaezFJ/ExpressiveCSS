# Dependency updates. Grouped deliberately: one PR a week per ecosystem beats
# five, and every one of these lands on a branch that CI runs before it merges.
version: 2

updates:
  # Update immutable action SHAs and their version comments.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # Build and test tooling only -- the package ships no runtime dependencies.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # esbuild, sass, typescript and jsdom all move often. A major is worth
      # reading on its own; minors and patches are not worth five PRs.
      build-tooling:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /mcp/expressivecss
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      mcp-dependencies:
        patterns: ['*']
        update-types: [minor, patch]
