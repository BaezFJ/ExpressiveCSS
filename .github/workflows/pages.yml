name: Deploy docs site

on:
  # Everything that changes what the site publishes -- `package.json` and its
  # lockfile because BaseLayout renders the version out of the first into every
  # footer and the second decides which astro builds the site.
  #
  # That version path is also what replaces the `workflow_run: [Release]`
  # trigger this used to carry: the release commit bumps `package.json` on
  # master and deploys from here like any other change. It is not equivalent,
  # and the difference is deliberate. The old trigger fired only on a
  # *successful* publish, so the site could never advertise a version that
  # never reached npm; the push fires when the commit lands, which is before
  # the `npm-publish` reviewer has approved anything. A failed or unapproved
  # release now leaves the footer a version ahead of the registry until the
  # next deploy. Traded for a workflow that holds no write access to master.
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'src/**'
      # Published verbatim at /llm.md and /m3-guidelines.md, and concatenated
      # into /llms-full.txt. Neither sits under docs/, so without these a
      # commit touching only a primary document would leave the published
      # copies stale.
      - 'llm.md'
      - 'm3-guidelines.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Read-only contents: the deploy uploads an artifact and commits nothing
# (ADR 0003), so it can never race a normal development commit on master.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in flight: a half-published site is worse than a
# slightly stale one. Queued runs wait instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # The branch tip, not the triggering commit. Order within a concurrency
      # group is not guaranteed: two pushes landing close together can be
      # picked up out of order, and the loser would then publish an older tree
      # over a newer one with nothing to correct it until the next deploy.
      # Building whatever master points at makes a late run harmless -- it
      # republishes the current site rather than a past one. It also means a
      # manual dispatch always publishes master, which is what a retry wants.
      - uses: actions/checkout@v7
        with:
          ref: master

      # 24 rather than the package's own floor of 20: astro 7 declares
      # ">=22.12.0", so no `docs:*` script runs on 20.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The whole build: the framework first (docs/public/dist is a symlink
      # into dist/, and Vite's public-dir copy stats every entry), then Astro
      # into _site/, then scripts/verify-site.mjs over what it wrote. That is
      # the same command a contributor runs and the same directory it
      # produces, published here unmodified -- no rewriting, no second copy of
      # the assets, nothing assembled that `npm run docs:build` did not.
      - run: npm run docs:build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      # The custom domain, https://www.expressivecss.com. Read from the
      # deployment rather than written out here, so it cannot claim an address
      # the site does not have. The domain itself is repository configuration
      # (Settings -> Pages), *not* docs/public/CNAME: an artifact deploy --
      # `build_type: workflow` -- ignores that file, which is published as a
      # versioned declaration of where the site lives and nothing more.
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
