name: Deploy docs site

on:
  # After a successful npm publish. The release commit bumps the version that
  # docs/app.py renders into every page, so the site is stale until it is
  # regenerated. Failed and cancelled releases are filtered by the job's `if`.
  workflow_run:
    workflows: [Release]
    types: [completed]
  # website/** is deliberately absent: it is generated output now, rewritten by
  # the freeze step below. Edit docs/ instead.
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'freeze.py'
      # The site serves these three verbatim at /llm.md, /m3-guidelines.md and
      # (concatenated) /llms-full.txt, and gen_llms.py writes llms.txt. None of
      # them sits under docs/, so without these entries a commit touching only
      # a primary document deploys nothing and the published copies go stale.
      - 'llm.md'
      - 'm3-guidelines.md'
      - 'scripts/gen_llms.py'
      - 'package.json'
      - 'package-lock.json'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write # commits the regenerated website/ back to master
  pages: write
  id-token: write

# Never cancel a deploy in flight: a half-published site is worse than a
# slightly stale one. Queued runs wait instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    # A release that failed or was cancelled must not publish docs claiming a
    # version that never reached npm. Other triggers always run.
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success'

    steps:
      # Explicitly master, not the triggering ref: on workflow_run the default
      # checkout is the Release run's head (a tag), which is detached and cannot
      # be pushed to. The release commit is on master anyway.
      - uses: actions/checkout@v7
        with:
          ref: master

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Must precede the freeze. docs/app.py serves /dist/... straight out of
      # this directory and sets build_missing when it is absent, which renders a
      # "run npm run build" banner into every page it then freezes.
      - run: npm run build

      # Pinned to a full version: setup-uv stopped publishing floating major
      # tags after v7, so @v10 does not resolve.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv sync --frozen

      # Must precede the freeze, which serves llms.txt straight off disk. It
      # states the version, so a release commit leaves it stale -- regenerated
      # here for the same reason website/ is, rather than checked, so nobody
      # has to remember it at release time.
      - name: Regenerate llms.txt
        run: uv run --frozen python scripts/gen_llms.py

      # Frozen-Flask walks docs/app.py's 98 routes and writes website/. It also
      # picks up the /dist/... URLs the templates build with url_for, so
      # website/dist/ comes from the build above.
      - name: Regenerate the static site
        run: uv run --frozen python freeze.py

      - name: Commit the regenerated site
        run: |
          set -euo pipefail
          # -A, not diff: freeze can add pages for new routes, and untracked
          # files are invisible to `git diff`. website/dist/ stays ignored, as
          # do the three frozen copies of files already in the repo.
          git add -A website llms.txt
          if git diff --cached --quiet; then
            echo "website/ is already up to date, nothing to commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Regenerate the docs site'
          # Master may have moved while the framework was building.
          git push origin HEAD:master || {
            git fetch origin master
            git rebase origin/master
            git push origin HEAD:master
          }
          echo "committed $(git show --stat --oneline HEAD | tail -1)"

      - name: Assemble the site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          # The freshly frozen pages, plus static/.
          cp -R website/. _site/

          # llm.md, m3-guidelines.md and llms-full.txt ride along in that copy:
          # the freeze wrote them even though git ignores them under website/.

          # Framework assets, freshly built. Frozen-Flask also emits website/dist
          # from the same files, but this is replaced rather than merged so the
          # build output is unambiguously what ships.
          rm -rf _site/dist
          mkdir -p _site/dist
          cp -R dist/css _site/dist/css
          cp -R dist/js _site/dist/js

          # Pages has no directory-index concept beyond index.html, and the
          # site's landing page is getting-started.html. Copy rather than move
          # so the 96 in-site links to getting-started.html keep resolving.
          cp _site/getting-started.html _site/index.html

          # Belt and braces: the artifact is served as-is, but this guarantees
          # no Jekyll pass ever eats a file.
          touch _site/.nojekyll

      # The pages use root-absolute URLs (/dist/..., /static/..., /color.html),
      # which resolve to https://baezfj.github.io/dist/... on a project page --
      # the wrong origin path, so every asset and link 404s. Rewriting them to
      # relative works because the site is flat: every page sits at the root of
      # _site, so "color.html" and "dist/css/..." resolve correctly from any of
      # them, at a project subpath or at a custom domain later.
      #
      # The three patterns are deliberately narrow. A blanket ="/ -> =" would
      # also hit the HTML-escaped code samples on the breadcrumbs, collections
      # and pagination pages, which document links like href="/library" and
      # href="/p/1" -- rewriting those would corrupt the documentation itself.
      - name: Make asset and page URLs relative
        run: |
          set -euo pipefail
          find _site -name '*.html' -print0 | xargs -0 sed -i -E \
            -e 's|="/dist/|="dist/|g' \
            -e 's|="/static/|="static/|g' \
            -e 's|="/([a-z0-9-]+\.html(#[^"]*)?)"|="\1"|g'

          # Informational only -- || true because grep exits 1 on no matches,
          # which pipefail would turn into a failed step.
          echo "Remaining root-absolute refs (expected: only escaped code samples):"
          { grep -rhoE '(href|src)="/[^"]*"' _site --include='*.html' || true; } \
            | sort | uniq -c | sort -rn | head -20

      # Fails the build rather than publishing a site whose CSS 404s.
      - name: Verify the assembled site
        run: |
          set -euo pipefail
          missing=0
          for f in \
            index.html \
            getting-started.html \
            dist/css/expressive.min.css \
            dist/js/expressive.min.js \
            static/docs.css \
            static/docs.js \
            llms.txt \
            llms-full.txt \
            llm.md \
            m3-guidelines.md
          do
            if [ -s "_site/$f" ]; then
              echo "  OK       $f"
            else
              echo "::error::missing or empty in _site: $f"
              missing=1
            fi
          done

          # Every local href/src on every page must exist on disk.
          #
          # <code> blocks are cut out first, whole. The docs quote example HTML
          # like src="images/sample-1.jpg" and href="css/expressive.min.css",
          # which describe a reader's project tree, not files in this site.
          # Filtering the lines that carry &lt;/&gt; instead of the element was
          # close but not equivalent: a sample pretty-printed one attribute per
          # line leaves href="portrait.html" alone on a line holding neither
          # entity, which is how the carousel page reported three missing files
          # that are not references at all. An href inside <code> is escaped
          # text by construction, so nothing live is lost with them.
          #
          # A ref is trimmed at the first ? or # before the disk check: docs.css
          # and docs.js carry a ?v=<version> cache-buster from both generators,
          # and matching that literally is a filename no site has ever had.
          for page in _site/*.html; do
            while read -r ref; do
              [ -e "_site/${ref%%[?#]*}" ] || {
                echo "::error::$(basename "$page") references missing ${ref%%[?#]*}"
                missing=1
              }
            done < <(perl -0777 -pe 's|<code\b.*?</code>||gs' "$page" \
                     | grep -oE '(href|src)="[a-z0-9][^":]*"' \
                     | sed -E 's/.*="([^"]*)"/\1/' | sort -u)
          done

          echo "pages: $(find _site -name '*.html' | wc -l)"
          exit $missing

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
