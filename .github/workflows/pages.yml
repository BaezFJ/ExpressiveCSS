name: Deploy stable documentation

# Only the successful stable framework release calls this workflow.
on:
  workflow_call:
    inputs:
      commit:
        type: string
        required: true
      tag:
        type: string
        required: true
      version:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the exact stable release commit
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/master
          node -e 'const p=JSON.parse(require("fs").readFileSync("package.json","utf8")); if (p.version !== process.env.RELEASE_VERSION || !/^\d+\.\d+\.\d+$/.test(p.version)) process.exit(1)'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Recheck npm latest immediately before deployment
        id: current
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync } from 'node:fs';
          import { isCurrentStable } from './scripts/release.mjs';
          const latest = JSON.parse(execFileSync('npm', ['view', '@expressivecss/expressive@latest', 'version', '--json'], { encoding: 'utf8', timeout: 60000 }));
          const current = isCurrentStable(process.env.RELEASE_VERSION, latest);
          appendFileSync(process.env.GITHUB_OUTPUT, `current=${current}\n`);
          if (!current) appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Skipped documentation deployment: this release is no longer npm latest.\n');
          JS
      - id: deployment
        if: steps.current.outputs.current == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
