name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A newer push supersedes a PR run. Each master commit keeps its own run, so
# merging several PRs in a row still shows which commit broke master.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # package.json "engines" declares >=20, so 20 has to keep building.
        # It cannot run the tests, though -- see the test step below -- and it
        # cannot run any `docs:*` script either: astro 7 declares
        # ">=22.12.0". Both are tooling requirements, not the package's, so
        # neither is a reason to raise "engines". The documentation build is a
        # job of its own below, on a single version, for that reason.
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # A squash merge can leave the roadmap's recorded revision outside all
      # branch histories. Fetch it explicitly for the source-link assertions.
      - name: Fetch the recorded capability source revision
        if: matrix.node != 20
        run: |
          capability_revision="$(node -e '
            const { sourceRevision } = require("./docs/src/data/component-decisions.json");
            require("node:assert/strict").match(sourceRevision, /^[a-f0-9]{40}$/u);
            process.stdout.write(sourceRevision);
          ')"
          git fetch --no-tags origin "$capability_revision"

      - run: npm ci

      - run: npm run typecheck

      # Full build: the test suite runs against the built dist/js/expressive.mjs,
      # so a stale or missing bundle would test stale code.
      - run: npm run build

      # Skipped on 20 because the test tooling, not the package, needs newer:
      # jsdom 30 declares engines "^22.22.2 || ^24.15.0 || >=26.0.0", and its
      # undici dependency calls webidl.util.markAsUncloneable, which does not
      # exist on Node 20. Consumers never load jsdom, so this is not a reason
      # to raise the package's own "engines" -- Node 20 still has to build.
      - run: npm run test:node
        if: matrix.node != 20

      - run: node scripts/verify-packages.mjs framework
        if: matrix.node == 24

  mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        # Exercise the supported Node 22/24 floors and the current Node 26 release.
        node: ['22.22.2', '24.15.0', '26']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: mcp/expressivecss/package-lock.json

      - run: npm ci --engine-strict
        working-directory: mcp/expressivecss

      # The tarball check below runs the smoke test twice on 24.15.0: once as
      # the prepack script and once from the installed package.
      - run: npm test
        if: matrix.node != '24.15.0'
        working-directory: mcp/expressivecss

      - name: Verify the MCP tarball in a clean consumer
        if: matrix.node == '24.15.0'
        run: |
          npm ci
          node scripts/verify-packages.mjs mcp

  # The documentation site, built and verified the way a contributor does it -
  # `npm run docs:build`, no Python anywhere. The built artifact is the seam
  # the source-level tests cannot reach: a page can be authored correctly and
  # still publish at the wrong URL, link at a file the build never wrote, ship
  # without a stylesheet, or violate a document-level semantics rule that no
  # fragment could have been checked against. scripts/verify-site.mjs asks all
  # of that of _site/, and docs:build chains it.
  #
  # Its own job rather than a step in the matrix above: astro 7 declares
  # ">=22.12.0", so it cannot run on the Node 20 leg, and building the site
  # three times to learn the same thing helps nobody.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Builds the framework first: docs/public/dist is a symlink into dist/,
      # and Vite's public-dir copy stats every entry, so a dangling one kills
      # the build before a page is emitted.
      - run: npm run docs:build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unreleased-docs
          path: _site/
          retention-days: 7
          if-no-files-found: error

  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:generated

  # One leg per engine: node:test runs a file's tests in sequence, so a single
  # job spent ~8 minutes on the two largest files. Chromium-only files skip
  # themselves in the other legs. Firefox is the slowest engine even with one
  # shared browser per file (tests/browser.js), so it runs in two shards.
  browser:
    name: browser (${{ matrix.engine }} ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: chromium, shard: 1, shards: 1 }
          - { engine: firefox, shard: 1, shards: 2 }
          - { engine: firefox, shard: 2, shards: 2 }
          - { engine: webkit, shard: 1, shards: 1 }
    env:
      EXPRESSIVECSS_TEST_BROWSER: ${{ matrix.engine }}
      EXPRESSIVECSS_TEST_SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run test:docker
      # The critical-flow file runs in shard 1 and is the only test that writes
      # reports, so other shards have nothing to check or upload.
      - run: node scripts/check-container-reports.mjs
        if: matrix.shard == 1
      - name: Retain critical-flow results and failure traces
        if: always() && matrix.shard == 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-critical-flows-${{ matrix.engine }}
          path: .cache/container-tests/
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error

  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          comment-summary-in-pr: never
      - name: No PR dependency delta on push
        if: github.event_name != 'pull_request'
        run: echo 'Dependency changes are reviewed before merge.'

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: /language:${{ matrix.language }}

  required:
    name: required
    if: always()
    needs: [build, mcp, docs, generated, browser, dependency-review, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every prerequisite to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs=JSON.parse(process.env.RESULTS); for (const [name,job] of Object.entries(jobs)) { if (job.result !== "success") { console.error(name + ": " + job.result); process.exitCode=1; } }'
