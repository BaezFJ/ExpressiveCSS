name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json "engines" declares >=20, so 20 has to keep building.
        # It cannot run the tests, though -- see the test step below -- and it
        # cannot run any `docs:*` script either: astro 7 declares
        # ">=22.12.0". Both are tooling requirements, not the package's, so
        # neither is a reason to raise "engines". The documentation build is a
        # job of its own below, on a single version, for that reason.
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Full build: the test suite runs against the built dist/js/expressive.mjs,
      # so a stale or missing bundle would test stale code.
      - run: npm run build

      # Skipped on 20 because the test tooling, not the package, needs newer:
      # jsdom 30 declares engines "^22.22.2 || ^24.15.0 || >=26.0.0", and its
      # undici dependency calls webidl.util.markAsUncloneable, which does not
      # exist on Node 20. Consumers never load jsdom, so this is not a reason
      # to raise the package's own "engines" -- Node 20 still has to build.
      - run: npm run test:run
        if: matrix.node != 20

      # Catches the failure mode where dist/ is gitignored and nothing rebuilds
      # it: proves `prepack` regenerates every exports target from clean.
      - name: Verify the published tarball
        if: matrix.node == 24
        run: |
          rm -rf dist
          npm pack --pack-destination "$RUNNER_TEMP"
          tar tzf "$RUNNER_TEMP"/*.tgz > "$RUNNER_TEMP/files.txt"
          missing=0
          for f in \
            dist/types/index.d.ts \
            dist/js/expressive.mjs \
            dist/js/expressive.cjs \
            dist/js/expressive.min.js \
            dist/css/expressive.css \
            dist/css/expressive.min.css \
            src/sass/expressive.scss \
            LICENSE \
            README.md
          do
            if grep -qx "package/$f" "$RUNNER_TEMP/files.txt"; then
              echo "  OK       $f"
            else
              echo "::error::missing from tarball: $f"
              missing=1
            fi
          done
          exit $missing

  mcp:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: mcp/expressivecss/package-lock.json

      - run: npm ci
        working-directory: mcp/expressivecss

      - run: npm test
        working-directory: mcp/expressivecss

      # Proves the published package carries its guide data and runs without
      # reaching back into this checkout.
      - name: Verify the MCP tarball in a clean consumer
        if: matrix.node == 24
        working-directory: mcp/expressivecss
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/mcp-consumer"
          cd "$RUNNER_TEMP/mcp-consumer"
          npm init -y
          tarballs=("$RUNNER_TEMP"/expressivecss-mcp-server-*.tgz)
          npm install "${tarballs[0]}"
          node node_modules/@expressivecss/mcp-server/smoke.mjs

  # The documentation site, built and verified the way a contributor does it -
  # `npm run docs:build`, no Python anywhere. The built artifact is the seam
  # the source-level tests cannot reach: a page can be authored correctly and
  # still publish at the wrong URL, link at a file the build never wrote, ship
  # without a stylesheet, or violate a document-level semantics rule that no
  # fragment could have been checked against. scripts/verify-site.mjs asks all
  # of that of _site/, and docs:build chains it.
  #
  # Its own job rather than a step in the matrix above: astro 7 declares
  # ">=22.12.0", so it cannot run on the Node 20 leg, and building the site
  # three times to learn the same thing helps nobody.
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Builds the framework first: docs/public/dist is a symlink into dist/,
      # and Vite's public-dir copy stats every entry, so a dangling one kills
      # the build before a page is emitted.
      - run: npm run docs:build
