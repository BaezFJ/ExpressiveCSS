name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json "engines" declares >=20, so 20 has to keep building.
        # It cannot run the tests, though -- see the test step below -- and it
        # cannot run any `docs:*` script either: astro 7 declares
        # ">=22.12.0". Both are tooling requirements, not the package's, so
        # neither is a reason to raise "engines". The documentation build is a
        # job of its own below, on a single version, for that reason.
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Full build: the test suite runs against the built dist/js/expressive.mjs,
      # so a stale or missing bundle would test stale code.
      - run: npm run build

      # Skipped on 20 because the test tooling, not the package, needs newer:
      # jsdom 30 declares engines "^22.22.2 || ^24.15.0 || >=26.0.0", and its
      # undici dependency calls webidl.util.markAsUncloneable, which does not
      # exist on Node 20. Consumers never load jsdom, so this is not a reason
      # to raise the package's own "engines" -- Node 20 still has to build.
      - run: npm run test:node
        if: matrix.node != 20

      - run: node scripts/verify-packages.mjs framework
        if: matrix.node == 24

  mcp:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 24]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: mcp/expressivecss/package-lock.json

      - run: npm ci
        working-directory: mcp/expressivecss

      - run: npm test
        working-directory: mcp/expressivecss

      - name: Verify the MCP tarball in a clean consumer
        if: matrix.node == 24
        run: |
          npm ci
          node scripts/verify-packages.mjs mcp

  # The documentation site, built and verified the way a contributor does it -
  # `npm run docs:build`, no Python anywhere. The built artifact is the seam
  # the source-level tests cannot reach: a page can be authored correctly and
  # still publish at the wrong URL, link at a file the build never wrote, ship
  # without a stylesheet, or violate a document-level semantics rule that no
  # fragment could have been checked against. scripts/verify-site.mjs asks all
  # of that of _site/, and docs:build chains it.
  #
  # Its own job rather than a step in the matrix above: astro 7 declares
  # ">=22.12.0", so it cannot run on the Node 20 leg, and building the site
  # three times to learn the same thing helps nobody.
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Builds the framework first: docs/public/dist is a symlink into dist/,
      # and Vite's public-dir copy stats every entry, so a dangling one kills
      # the build before a page is emitted.
      - run: npm run docs:build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unreleased-docs
          path: _site/
          retention-days: 7
          if-no-files-found: error

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:generated

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          comment-summary-in-pr: never
      - name: No PR dependency delta on push
        if: github.event_name != 'pull_request'
        run: echo 'Dependency changes are reviewed before merge.'

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: /language:${{ matrix.language }}

  required:
    name: required
    if: always()
    needs: [build, mcp, docs, generated, browser, dependency-review, codeql]
    runs-on: ubuntu-latest
    steps:
      - name: Require every prerequisite to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs=JSON.parse(process.env.RESULTS); for (const [name,job] of Object.entries(jobs)) { if (job.result !== "success") { console.error(name + ": " + job.result); process.exitCode=1; } }'
