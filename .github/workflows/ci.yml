name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json "engines" declares >=20, so 20 has to keep building.
        # It cannot run the tests, though -- see the test step below -- and it
        # cannot run any `docs:*` script either: astro 7 declares
        # ">=22.12.0". Both are tooling requirements, not the package's, so
        # neither is a reason to raise "engines"; but a docs step added to this
        # job has to skip 20 the way the test step does.
        node: [20, 22, 24]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Full build: the test suite runs against the built dist/js/expressive.mjs,
      # so a stale or missing bundle would test stale code.
      - run: npm run build

      # Skipped on 20 because the test tooling, not the package, needs newer:
      # jsdom 30 declares engines "^22.22.2 || ^24.15.0 || >=26.0.0", and its
      # undici dependency calls webidl.util.markAsUncloneable, which does not
      # exist on Node 20. Consumers never load jsdom, so this is not a reason
      # to raise the package's own "engines" -- Node 20 still has to build.
      - run: npm run test:run
        if: matrix.node != 20

      # website/ is generated from docs/templates by freeze.py and committed.
      # tests/semantics.test.js checks those frozen pages as whole documents -
      # main nesting, dialog naming, duplicate landmark names - which is only
      # meaningful if they match the templates they came from. Nothing else
      # enforces that: a template-only change leaves the old HTML in place and
      # the composed checks pass against a snapshot of the previous state.
      #
      # This is also the diff CLAUDE.md already prescribes for verifying any
      # template change; it was just never automated.
      - name: Verify the frozen site matches the templates
        if: matrix.node == 24
        run: |
          pipx install uv || pip install uv
          uv run python freeze.py
          if ! git diff --quiet -- website/; then
            echo "::error::website/ is stale - run 'uv run python freeze.py' and commit the result"
            git diff --stat -- website/
            exit 1
          fi
          echo "  OK       website/ is in step with docs/templates"

      # Catches the failure mode where dist/ is gitignored and nothing rebuilds
      # it: proves `prepack` regenerates every exports target from clean.
      - name: Verify the published tarball
        if: matrix.node == 24
        run: |
          rm -rf dist
          npm pack --pack-destination "$RUNNER_TEMP"
          tar tzf "$RUNNER_TEMP"/*.tgz > "$RUNNER_TEMP/files.txt"
          missing=0
          for f in \
            dist/types/index.d.ts \
            dist/js/expressive.mjs \
            dist/js/expressive.cjs \
            dist/js/expressive.min.js \
            dist/css/expressive.css \
            dist/css/expressive.min.css \
            src/sass/expressive.scss \
            LICENSE \
            README.md
          do
            if grep -qx "package/$f" "$RUNNER_TEMP/files.txt"; then
              echo "  OK       $f"
            else
              echo "::error::missing from tarball: $f"
              missing=1
            fi
          done
          exit $missing
