name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: Package to validate and dry-run; manual runs never publish
        required: true
        default: framework
        type: choice
        options: [framework, mcp]

permissions:
  contents: read

# Serialize releases so an older version cannot race a newer npm dist-tag update.
concurrency:
  group: npm-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name }}
  RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
  RELEASE_PACKAGE: ${{ inputs.package }}

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      kind: ${{ steps.package.outputs.kind }}
      directory: ${{ steps.package.outputs.directory }}
      name: ${{ steps.package.outputs.name }}
      version: ${{ steps.package.outputs.version }}
      distTag: ${{ steps.package.outputs.distTag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit merged into master
        run: git merge-base --is-ancestor HEAD origin/master
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Select and validate the release package
        id: package
        run: node scripts/release.mjs
      - run: npm ci
      - run: npm ci --prefix mcp/expressivecss
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - run: npm test --prefix mcp/expressivecss
      - run: npm run verify:packages
      - name: Check registry availability
        if: github.event_name == 'release'
        run: node scripts/release.mjs --registry
      - name: Pack the validated release
        working-directory: ${{ steps.package.outputs.directory }}
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-package
          path: ${{ runner.temp }}/*.tgz
          if-no-files-found: error
          retention-days: 7
      - name: Manual dry run
        if: github.event_name == 'workflow_dispatch'
        env:
          DIST_TAG: ${{ steps.package.outputs.distTag }}
        run: |
          packages=("$RUNNER_TEMP"/*.tgz)
          test "${#packages[@]}" -eq 1
          npm publish "${packages[0]}" --access public --tag "$DIST_TAG" --ignore-scripts --dry-run
          echo 'Validation and dry run succeeded; nothing was published.' >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: validate
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11.19.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-package
          path: ${{ runner.temp }}/release
      - name: Recheck registry after approval
        run: node scripts/release.mjs --registry
      - name: Publish the validated tarball with OIDC
        env:
          DIST_TAG: ${{ needs.validate.outputs.distTag }}
        run: |
          packages=("$RUNNER_TEMP"/release/*.tgz)
          test "${#packages[@]}" -eq 1
          npm publish "${packages[0]}" --access public --tag "$DIST_TAG" --ignore-scripts
      - name: Record successful publication
        env:
          PACKAGE_NAME: ${{ needs.validate.outputs.name }}
          PACKAGE_VERSION: ${{ needs.validate.outputs.version }}
          DIST_TAG: ${{ needs.validate.outputs.distTag }}
        run: |
          echo "Published $PACKAGE_NAME@$PACKAGE_VERSION to $DIST_TAG." >> "$GITHUB_STEP_SUMMARY"

  docs:
    needs: [validate, publish]
    if: github.event_name == 'release' && needs.validate.outputs.kind == 'framework' && needs.validate.outputs.distTag == 'latest'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      commit: ${{ github.sha }}
      tag: ${{ github.event.release.tag_name }}
      version: ${{ needs.validate.outputs.version }}
