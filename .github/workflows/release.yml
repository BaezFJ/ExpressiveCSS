name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dist-tag:
        description: npm dist-tag to publish under
        required: true
        default: next
        type: choice
        options: [next, latest]
      dry-run:
        description: Pack and validate, but do not publish
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  # Mints the OIDC token that signs the provenance attestation. Also the
  # permission trusted publishing needs, once this package exists on npm and a
  # trusted publisher is configured for it (see the Publish step).
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    # Optional gate: create an environment named "npm-publish" in repo Settings
    # -> Environments with yourself as a required reviewer, so every publish
    # needs a human click. If you enable it, add the same environment name to
    # the trusted publisher config on npmjs.com -- it is part of the identity
    # npm matches against, and a mismatch rejects the publish.
    # environment: npm-publish

    env:
      # release: prereleases go to "next", full releases to "latest".
      # workflow_dispatch: whatever was chosen in the run dialog.
      DIST_TAG: >-
        ${{ github.event_name == 'workflow_dispatch'
            && inputs.dist-tag
            || (github.event.release.prerelease && 'next' || 'latest') }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          # Writes an .npmrc pointing at the public registry, which is where
          # the OIDC exchange happens. Still required without a token.
          registry-url: https://registry.npmjs.org

      - run: npm ci

      # Trusted publishing needs npm >= 11.5.1. Node 24 ships an npm 11, but
      # not necessarily a new enough one, and a too-old CLI fails by falling
      # back to token auth (i.e. an EOTP or ENEEDAUTH) rather than saying so.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          echo "npm $(npm --version) / node $(node --version)"

      # There is no token to test against, so the pre-flight check is that the
      # OIDC machinery is actually available: these two variables only exist
      # when `permissions: id-token: write` is in effect. Without them npm
      # silently falls back to token auth and fails at the publish step.
      - name: Verify OIDC is available
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ] || [ -z "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            echo "::error::No OIDC token available -- check 'permissions: id-token: write'"
            exit 1
          fi
          echo "OIDC token endpoint present"
          scope="$(node -p "require('./package.json').name.split('/')[0]")"
          echo "publishing under scope: $scope"

      # A release tag that disagrees with package.json publishes a version whose
      # git tag points at different code. Fail loudly instead.
      - name: Verify package version matches the release tag
        if: github.event_name == 'release'
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${TAG_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::package.json version ($pkg) does not match release tag ($tag)"
            exit 1
          fi
          echo "version $pkg matches tag $TAG_NAME"

      - name: Refuse to overwrite an existing version
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::error::$name@$version is already published"
            exit 1
          fi
          echo "$name@$version is not yet on the registry"

      - run: npm run typecheck

      # `npm test` rebuilds every JS bundle first, then runs the jsdom suite.
      - run: npm test

      # Trusted publishing: npm mints a short-lived OIDC credential for this
      # exact repo + workflow, so there is no NODE_AUTH_TOKEN. The trusted
      # publisher is configured on the package at npmjs.com and every field is
      # case-sensitive, including the workflow filename "release.yml".
      #
      # No --provenance flag: provenance is generated automatically here.
      # Token auth previously failed with EOTP because the account requires 2FA
      # for writes; an OIDC credential is not a user credential, so it is not
      # subject to that.
      - name: Publish
        if: env.DRY_RUN != 'true'
        run: npm publish --access public --tag "$DIST_TAG"

      - name: Dry run (pack only)
        if: env.DRY_RUN == 'true'
        run: npm publish --access public --tag "$DIST_TAG" --dry-run

      - name: Summary
        if: always()
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ "$DRY_RUN" = "true" ]; then verb="Dry run"; else verb="Published"; fi
          {
            echo "### $verb \`$name@$version\`"
            echo
            echo "- dist-tag: \`$DIST_TAG\`"
            echo "- trigger: \`$GITHUB_EVENT_NAME\`"
          } >> "$GITHUB_STEP_SUMMARY"
