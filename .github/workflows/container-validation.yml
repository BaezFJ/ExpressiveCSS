name: Container validation

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Assert cold checkout
        run: |
          test ! -e node_modules
          test ! -e mcp/expressivecss/node_modules
          if docker image inspect expressivecss-playwright >/dev/null 2>&1; then exit 1; fi
          version=$(node -p 'require("./package-lock.json").packages["node_modules/playwright"].version')
          if docker image inspect "mcr.microsoft.com/playwright:v$version-noble" >/dev/null 2>&1; then exit 1; fi
          docker version
          docker compose version
      # verify's `node --test` includes the browser suites, so one run produces the reports.
      - run: npm run test:docker -- npm run verify
      - run: node scripts/check-container-reports.mjs
      - run: npm run test:packages:docker
      - run: npm run test:visual:docker -- --grep buttons --workers 2
      - run: node scripts/check-container-docs.mjs
      - name: Verify failed command exports and cleanup
        run: |
          set +e
          npm run test:docker -- node -e 'require("node:fs").writeFileSync(".cache/cross-browser/failure-probe.json", JSON.stringify({status:"failed",container:require("node:os").hostname()})); process.exit(7)'
          status=$?
          set -e
          test "$status" -eq 7
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readdirSync,readFileSync} from 'node:fs';
          import {spawnSync} from 'node:child_process';
          const root='.cache/container-tests';
          const files=readdirSync(root,{recursive:true}).filter(f=>f.endsWith('/failure-probe.json'));
          assert.equal(files.length,1);
          const report=JSON.parse(readFileSync(`${root}/${files[0]}`));
          assert.equal(report.status,'failed');
          const result=spawnSync('docker',['container','inspect',report.container]);
          if(result.error) throw result.error;
          assert.notEqual(result.status,0,'Failed container was not removed');
          JS
      - name: Cleanup and verify host remains unchanged
        if: always()
        run: |
          docker compose down
          test ! -e docs/src/pages/container-hmr-probe.astro
          test ! -e docs/static/container-hmr-probe.css
          test ! -e docs/static/container-hmr-probe.js
          test ! -e node_modules
          test ! -e mcp/expressivecss/node_modules
          git diff --exit-code
          git diff --cached --exit-code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: container-validation
          path: .cache/container-tests/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

