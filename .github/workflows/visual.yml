name: Visual regression

# Only on pull requests, and only when something that can move a pixel changed.
# There is nothing to compare a push to master against but its own parent,
# which is the diff the pull request already showed.
on:
  pull_request:
    branches: [master]
    paths:
      - 'src/sass/**'
      - 'src/ts/**'
      - 'docs/**'
      # sass and esbuild decide what the sheet and the bundle look like, and a
      # dependency bump is exactly when nobody is looking at pixels.
      #
      # Be clear about what that buys, though, because it is less than it
      # sounds: visual/run.mjs symlinks this checkout's node_modules into the
      # base worktree, so both passes build through one installation and a
      # bump is applied to the baseline as well as the candidate. A rendering
      # change it causes cancels out. What these two entries actually get you
      # is that the new toolchain has to build both revisions and produce
      # photographable pages -- a smoke test, not an attribution. Issue #114
      # holds the trade-off that would fix it.
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/visual.yml'
      - 'visual/**'

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest

    steps:
      # Full history: visual/run.mjs compares against the merge base, which a
      # shallow clone does not have.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Builds and serves both revisions through Astro. A failure here means
      # pages moved, which is often intended -- the report is the thing to
      # read, not the exit code.
      - run: npm run test:visual

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: visual-report
          path: visual/report/
          retention-days: 14
