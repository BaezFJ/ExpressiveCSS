name: Visual regression

# Only on pull requests, and only when something that can move a pixel changed.
# There is nothing to compare a push to master against but its own parent,
# which is the diff the pull request already showed.
on:
  pull_request:
    paths:
      - 'src/sass/**'
      - 'src/ts/**'
      - 'docs/**'
      # sass, esbuild, Astro and Vite decide what the published site looks like.
      # This job installs the head lockfile below, and visual/run.mjs installs
      # the base lockfile in its worktree. A dependency bump therefore reaches
      # only the candidate and any rendering change it causes remains visible.
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/visual.yml'
      - 'visual/**'

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest

    steps:
      # Full history: visual/run.mjs compares against the merge base, which a
      # shallow clone does not have.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      # Installs the candidate. visual/run.mjs performs a second, cache-backed
      # npm ci in the base worktree so each pass builds with its own lockfile.
      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Builds and serves both revisions through Astro. A failure here means
      # pages moved, which is often intended -- the report is the thing to
      # read, not the exit code.
      - run: npm run test:visual

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: visual-report
          path: visual/report/
          retention-days: 14
