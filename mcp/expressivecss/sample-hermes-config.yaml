# Example Hermes MCP wiring for this server.
# Apply these values with `hermes config set` rather than hand-editing the file.

mcp_servers:
  expressivecss-mcp:
    command: node
    args:
      - /ABSOLUTE/PATH/TO/REPO/mcp/expressivecss/server.js
    env:
      EXPRESSIVECSS_MCP_MAX_COMPONENT_RESPONSE_CHARS: "24000"
      EXPRESSIVECSS_MCP_MAX_COMPONENT_SKIPS: "7"
      EXPRESSIVECSS_MCP_QA_MAX_FILES: "300"
      EXPRESSIVECSS_MCP_QA_MAX_MB: "2"
