<section aria-labelledby="delivery-title" class="setting-section">
  <h2 id="delivery-title">Delivery preference</h2>
  <p>Daily or weekly is a value saved with this draft, not an editor formatting command.</p>
  <div id="delivery-choice" class="button-group connected medium" data-selection="single" role="group" aria-label="Delivery preference">
    <button class="button tonal" type="button" aria-pressed="true" data-delivery="daily">Daily</button>
    <button class="button tonal" type="button" aria-pressed="false" data-delivery="weekly">Weekly</button>
  </div>
  <input id="delivery-value" type="hidden" name="delivery" value="daily">
</section>
