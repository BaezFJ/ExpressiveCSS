<!doctype html>
<html lang="en" theme="auto">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Update the name and contact details on your account.">
    <title>Account settings</title>
    <link rel="stylesheet" href="dist/css/expressive.min.css">
    <style>
      .settings { max-width: 40rem; }
      .settings fieldset { border: 0; margin: 0 0 1.5rem; padding: 0; }
      .settings legend { padding: 0; margin-bottom: 1rem; }
      .settings .field { margin-bottom: 1rem; }
      .form-actions { display: flex; justify-content: flex-end; }
    </style>
  </head>
  <body>
    <header>
      <nav aria-label="Main">
        <h2>Account</h2>
      </nav>
    </header>

    <main class="container py-5 mb-6">
      <div class="settings">
        <h1 class="headline-medium mb-2">Account settings</h1>
        <p class="body-large mb-4">Update how your name appears and how people can reach you.</p>

        <form id="account-form" action="/api/account" method="post" novalidate>
          <fieldset>
            <legend class="title-large">Profile</legend>
            <div class="field outlined">
              <input id="display_name" name="display_name" type="text" class="validate" required
                     maxlength="60" autocomplete="nickname" placeholder=" " aria-describedby="display_name_help">
              <label for="display_name">Display name</label>
              <small id="display_name_help" data-error="Enter a display name."><span>Shown on your profile and in comments.</span></small>
            </div>
            <div class="field outlined">
              <input id="website" name="website" type="url" class="validate" autocomplete="url"
                     spellcheck="false" placeholder=" " aria-describedby="website_help">
              <label for="website">Website (optional)</label>
              <small id="website_help" data-error="Enter a full address, such as https://example.com."><span>For example, https://example.com…</span></small>
            </div>
          </fieldset>

          <fieldset>
            <legend class="title-large">Contact</legend>
            <div class="field outlined">
              <input id="email" name="email" type="email" class="validate" required autocomplete="email"
                     spellcheck="false" autocapitalize="off" placeholder=" " aria-describedby="email_help">
              <label for="email">Email</label>
              <small id="email_help" data-error="Enter an email address, such as name@example.com."><span>We send account notices here.</span></small>
            </div>
            <div class="field outlined">
              <input id="phone" name="phone" type="tel" class="validate" autocomplete="tel"
                     pattern="[0-9+\(\)\- .]{7,20}" placeholder=" " aria-describedby="phone_help">
              <label for="phone">Phone (optional)</label>
              <small id="phone_help" data-error="Enter a phone number using digits, spaces, +, - or brackets."><span>Include your country code, such as +1 555 010 0199…</span></small>
            </div>
          </fieldset>

          <div class="form-actions">
            <button id="save" type="submit" class="filled"><span>Save</span></button>
          </div>
        </form>
      </div>
    </main>

    <script src="dist/js/expressive.min.js"></script>
    <script>
      (() => {
        const form = document.getElementById('account-form');
        const save = document.getElementById('save');
        const saveLabel = save.firstElementChild;
        const email = document.getElementById('email');
        const emailHelp = document.getElementById('email_help');
        const emailMessage = emailHelp.getAttribute('data-error');

        // Stand-in for POST /api/account: there is no server.
        function postAccount(url, body) {
          return new Promise((resolve, reject) => {
            setTimeout(() => {
              const address = String(body.get('email') || '').trim().toLowerCase();
              if (address.endsWith('@example.invalid')) {
                const error = new Error('This email address can’t receive mail.');
                error.field = 'email';
                reject(error);
              } else {
                resolve({ ok: true, url, method: 'POST' });
              }
            }, 1500);
          });
        }

        // A server error about the email field is replaced by the field's own message once it changes.
        email.addEventListener('input', () => {
          if (emailHelp.getAttribute('data-error') !== emailMessage) {
            emailHelp.setAttribute('data-error', emailMessage);
            email.removeAttribute('aria-invalid');
            email.classList.remove('invalid');
          }
        });

        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          if (save.getAttribute('aria-busy') === 'true') return;
          Expressive.Snackbar.dismissAll();

          form.checkValidity();
          const fields = [...form.elements].filter((f) => f.willValidate && f.classList.contains('validate'));
          fields.forEach((f) => Expressive.Forms.validateField(f));
          const firstInvalid = fields.find((f) => f.getAttribute('aria-invalid') === 'true');
          if (firstInvalid) { firstInvalid.focus(); return; }

          save.setAttribute('aria-busy', 'true');
          saveLabel.textContent = 'Saving…';
          const started = performance.now();
          let failure = null;
          try {
            await postAccount(form.getAttribute('action'), new FormData(form));
          } catch (error) {
            failure = error;
          } finally {
            const shown = performance.now() - started - 300; // spinner delay token
            if (shown > 0 && shown < 500) await new Promise((done) => setTimeout(done, 500 - shown));
            save.removeAttribute('aria-busy');
            saveLabel.textContent = 'Save';
          }

          if (!failure) {
            new Expressive.Snackbar({ text: 'Account settings saved', replace: true });
          } else if (failure.field === 'email') {
            emailHelp.setAttribute('data-error', 'Not saved. This email address can’t receive mail. Use a different address.');
            email.classList.add('invalid');
            email.setAttribute('aria-invalid', 'true');
            email.focus();
          } else {
            new Expressive.Snackbar({
              text: 'Couldn’t save your settings.',
              action: 'Retry',
              replace: true,
              onAction: () => form.requestSubmit(save),
            });
          }
        });
      })();
    </script>
  </body>
</html>
