{% macro banner(title, description) %}

    <section class="section primary-container my-2 mx-6" id="index-banner">
        <div class="container row py-5">
            <div class="s12 m8 offset-m1 xl7 offset-xl1 center-on-small-only">
                <h1 class="docs-page-title display-large on-primary-container-text">{{ title }}</h1>
                <p class="docs-page-description headline-small on-primary-container-text">{{ description }}</p>
            </div>
        </div>
    </section>

{% endmacro %}
