<!DOCTYPE html>
<html lang="en" theme="auto">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ExpressiveCSS{% endblock %}</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
    <link rel="stylesheet" href="{{ css_url }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='docs.css') }}">
    {# Apply a stored --md-source before first paint so the page does not flash the default seed. #}
    <script>
        (function () {
            try {
                var c = localStorage.getItem('md-source');
                if (c && /^#[0-9A-Fa-f]{6}$/.test(c)) {
                    document.documentElement.style.setProperty('--md-source', c);
                }
            } catch (e) {
            }
        })();
    </script>
    {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
{% if build_missing %}
    <div class="build-warning error-container on-error-container-text">
        No build found in <code>dist/</code> &mdash; run <code>npm run build</code> (or <code>npm run watch</code>) and
        reload.
    </div>
{% endif %}

{% block content %}{% endblock %}

<script src="{{ js_url }}"></script>
<script src="{{ url_for('static', filename='docs.js') }}"></script>
</body>
</html>
